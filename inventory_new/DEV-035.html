<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>DEV-035</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#F0EBF8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(139,92,246,.12) 0%,transparent 55%),radial-gradient(ellipse at 80% 80%,rgba(236,72,153,.08) 0%,transparent 55%);pointer-events:none}
.card{width:100%;max-width:370px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 8px 48px rgba(139,92,246,.15),0 2px 8px rgba(0,0,0,.06);animation:rise .5s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.top-band{background:linear-gradient(135deg,#7C3AED 0%,#A855F7 60%,#EC4899 100%);padding:28px 26px 24px;position:relative;overflow:hidden}
.top-band::after{content:'';position:absolute;bottom:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%}
.top-band::before{content:'';position:absolute;top:-20px;right:40px;width:70px;height:70px;background:rgba(255,255,255,.06);border-radius:50%}
.dev-id{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.12em;margin-bottom:6px;position:relative}
.model{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:6px;position:relative}
.category{font-size:11px;font-weight:500;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.1em;position:relative}
.rows{padding:8px 24px 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #F3F0FA}
.row:last-child{border-bottom:none}
.lbl{font-size:10.5px;font-weight:600;color:#A78BCA;text-transform:uppercase;letter-spacing:.1em;flex-shrink:0}
.val{font-size:14px;font-weight:500;color:#1E1030;text-align:right}
.s-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px}
.s-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cw{display:flex;align-items:center;gap:6px}
.cd{width:8px;height:8px;border-radius:50%}
.note-val{font-size:12px;color:#7C3AED;background:#F3EEFF;padding:3px 9px;border-radius:6px;font-family:'DM Mono',monospace}
.serial-block{margin:4px 24px 24px;background:#FAF8FF;border:1px dashed #DDD5F5;border-radius:14px;padding:14px 16px}
.serial-lbl{font-family:'DM Mono',monospace;font-size:9px;color:#B4A8CC;letter-spacing:.16em;text-transform:uppercase;margin-bottom:5px}
.serial-val{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:#7C3AED;letter-spacing:.04em;word-break:break-all}</style></head><body>
<div class="card">
  <div class="top-band">
    <div class="dev-id">DEV-035</div>
    <div class="model">Apple Magic Keyboard</div>
    <div class="category">Keyboard</div>
  </div>
  <div class="rows"><div class="row"><span class="lbl">Status</span><span class="val"><span class="s-pill" style="background:#DCFCE7;color:#15803D"><span class="s-dot" style="background:#22C55E"></span>In Office</span></span></div><div class="row"><span class="lbl">Condition</span><span class="val"><span class="cw"><span class="cd" style="background:#22C55E"></span>Good</span></span></div><div class="row"><span class="lbl">Employee</span><span class="val">Pierre</span></div></div>
  <div class="serial-block"><div class="serial-lbl">Serial Number</div><div class="serial-val">FOT4037RJDP1G67B4</div></div>
</div></body></html>
