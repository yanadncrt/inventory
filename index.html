<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:#F0F4F8;color:#2C3E50;min-height:100vh}

/* ── SHARED ── */
.hidden{display:none!important}
.toast{position:fixed;bottom:24px;right:24px;background:#1E3A5F;color:white;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* ── PUBLIC: HOME ── */
#pub-home{padding:20px 16px}
.pub-header{text-align:center;margin-bottom:20px}
.pub-header h1{font-size:22px;font-weight:800;color:#1E3A5F}
.pub-header p{font-size:13px;color:#95A5A6;margin-top:3px}
.device-list{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.drow{background:white;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
.drow:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.12);border-color:#2E6DAD}
.drow-img{width:46px;height:46px;object-fit:contain;border-radius:8px;background:#F8F9FA;padding:3px;border:1px solid #E0E6ED;flex-shrink:0}
.drow-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.drow-info{flex:1;overflow:hidden}
.drow-id{font-size:10px;font-weight:700;color:#95A5A6;letter-spacing:.4px}
.drow-model{font-size:14px;font-weight:700;color:#2C3E50;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow-sub{font-size:11px;color:#7F8C8D;margin-top:2px}
.drow-badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;color:white;flex-shrink:0}
.admin-hint{text-align:center;margin-top:24px}
.admin-hint button{background:none;border:none;color:#BDC3C7;font-size:12px;cursor:pointer;text-decoration:underline}

/* ── PUBLIC: CARD ── */
#pub-card{padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.back-btn{background:white;border:none;color:#2E6DAD;font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);width:100%;max-width:420px;text-align:left}
.card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.12);width:100%;max-width:420px}
.card-top{background:linear-gradient(135deg,#1E3A5F,#2E6DAD);padding:16px 18px 14px;color:white;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-top-left{flex:1}
.card-dev-id{font-size:11px;opacity:.7;font-weight:600;letter-spacing:.5px}
.card-model{font-size:18px;font-weight:800;line-height:1.2;margin-top:2px}
.card-cat{font-size:12px;opacity:.75;margin-top:3px}
.card-status{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;color:white;border:2px solid rgba(255,255,255,.35);flex-shrink:0;margin-top:2px}
.card-img{background:#F8F9FA;display:flex;align-items:center;justify-content:center;padding:20px;height:170px}
.card-img img{max-height:140px;max-width:100%;object-fit:contain}
.card-img .icon{font-size:72px}
.card-body{padding:16px 18px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{display:flex;flex-direction:column;gap:3px}
.info-item.full{grid-column:1/-1}
.info-label{font-size:10px;font-weight:700;color:#95A5A6;text-transform:uppercase;letter-spacing:.4px}
.info-value{font-size:13px;font-weight:600;color:#2C3E50}
.mono{font-family:'Courier New',monospace;font-size:11px;background:#F0F4F8;padding:3px 7px;border-radius:5px;word-break:break-all;font-weight:400}
.card-footer{border-top:1px solid #F0F4F8;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:#FAFBFC}
.footer-brand{font-size:11px;font-weight:700;color:#1E3A5F;opacity:.5}
.footer-qr img{width:52px;height:52px;border:1px solid #E0E6ED;border-radius:6px;padding:2px}

/* ── LOGIN ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{background:white;border-radius:20px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.12);text-align:center}
.login-box h2{font-size:20px;font-weight:800;color:#1E3A5F;margin-bottom:6px}
.login-box p{font-size:13px;color:#95A5A6;margin-bottom:24px}
.login-box input{width:100%;padding:12px 14px;border:2px solid #E0E6ED;border-radius:10px;font-size:15px;outline:none;text-align:center;letter-spacing:2px;margin-bottom:12px}
.login-box input:focus{border-color:#2E6DAD}
.login-box button{width:100%;padding:12px;background:#2E6DAD;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.login-box button:hover{background:#1E3A5F}
.login-err{color:#E74C3C;font-size:13px;margin-top:8px;display:none}
.back-to-pub{margin-top:14px;background:none;border:none;color:#BDC3C7;font-size:12px;cursor:pointer;text-decoration:underline;width:100%}

/* ── ADMIN ── */
#admin-screen{display:none}
.admin-header{background:linear-gradient(135deg,#1E3A5F,#2E6DAD);color:white;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.admin-header h1{font-size:18px;font-weight:700}
.hstats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.15);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600}
.toolbar{background:white;padding:12px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:2px solid #E8EDF2;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.sw{flex:1;min-width:180px;position:relative}
.sw input{width:100%;padding:8px 12px 8px 34px;border:2px solid #E0E6ED;border-radius:8px;font-size:13px;outline:none}
.sw input:focus{border-color:#2E6DAD}
.sw::before{content:"🔍";position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px}
select{padding:8px 11px;border:2px solid #E0E6ED;border-radius:8px;font-size:12px;cursor:pointer;outline:none;background:white}
.btn{padding:8px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.bp{background:#2E6DAD;color:white}.bs{background:#27AE60;color:white}.bo{background:#E8A020;color:white}.br{background:#E74C3C;color:white}.bg{background:#ECF0F1;color:#555}
.vt{display:flex;gap:3px}
.vb{padding:7px 11px;border:2px solid #E0E6ED;border-radius:8px;background:white;cursor:pointer;font-size:14px}
.vb.active{background:#2E6DAD;border-color:#2E6DAD;color:white}
.amain{padding:16px 20px}
.sumbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sp{background:white;border-radius:10px;padding:7px 14px;font-size:12px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;align-items:center;gap:6px}
.sd{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.gv{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gv.hide{display:none}.lv{display:none}.lv.show{display:block}
.acard{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;border:2px solid transparent;transition:all .2s;display:flex;flex-direction:column}
.acard:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12);border-color:#2E6DAD}
.acimg{height:150px;background:#F8F9FA;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.acimg img{width:100%;height:100%;object-fit:contain;padding:10px}
.asrib{position:absolute;top:8px;right:8px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;color:white}
.acbody{padding:12px 14px;flex:1}
.acid{font-size:10px;font-weight:700;color:#95A5A6;letter-spacing:.4px}
.acmodel{font-size:14px;font-weight:700;color:#2C3E50;margin-top:1px}
.accat{font-size:11px;color:#7F8C8D;margin-bottom:8px}
.irow{font-size:11px;color:#5D6D7E;margin:4px 0;display:flex;gap:5px}
.ilbl{font-weight:600;color:#95A5A6;min-width:60px;flex-shrink:0}
.stag{font-family:monospace;font-size:10px;background:#F0F4F8;padding:1px 5px;border-radius:3px}
.acfoot{padding:8px 14px;border-top:1px solid #F0F4F8;display:flex;align-items:center;justify-content:space-between;background:#FAFBFC}
.acfoot img{width:48px;height:48px;border:1px solid #E8EDF2;border-radius:6px;padding:2px}
.lt{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.lt th{background:#1E3A5F;color:white;padding:10px 12px;text-align:left;font-size:11px;font-weight:700}
.lt td{padding:9px 12px;font-size:12px;border-bottom:1px solid #F0F4F8;vertical-align:middle}
.lt tr:hover td{background:#F5F8FF;cursor:pointer}
.thumb{width:38px;height:38px;object-fit:contain;border-radius:5px;border:1px solid #E0E6ED;background:#F8F9FA;padding:2px}
.empty{text-align:center;padding:48px;color:#BDC3C7;font-size:15px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:white;border-radius:20px;width:92%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3);animation:pop .22s ease}
.mhdr{background:linear-gradient(135deg,#1E3A5F,#2E6DAD);color:white;padding:20px 22px;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:flex-start}
.mhdr h2{font-size:17px;margin-top:3px}
.mclose{background:rgba(255,255,255,.2);border:none;color:white;width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer}
.mbody{padding:20px 22px}
.mtop{display:flex;gap:16px;margin-bottom:18px;align-items:flex-start}
.mdi{width:120px;height:110px;object-fit:contain;border:2px solid #E0E6ED;border-radius:10px;padding:6px;background:#F8F9FA;flex-shrink:0}
.mqi{width:96px;height:96px;border:2px solid #E0E6ED;border-radius:8px;padding:3px;flex-shrink:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ff{display:flex;flex-direction:column;gap:3px}.ff.full{grid-column:1/-1}
.fl{font-size:10px;font-weight:700;color:#95A5A6;text-transform:uppercase;letter-spacing:.4px}
.fv{font-size:13px;color:#2C3E50;font-weight:500;padding:7px 10px;background:#F5F8FF;border-radius:7px;border:1px solid #E0E6ED;min-height:34px}
.fi{font-size:13px;color:#2C3E50;padding:7px 10px;background:white;border-radius:7px;border:2px solid #2E6DAD;outline:none;width:100%;font-family:inherit}
.ma{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.sbadge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;color:white}
.logout-btn{background:rgba(255,255,255,.15);border:none;color:white;font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer}

/* ── PRINT ── */
.pgrid{display:none}
@media print{
  body>*:not(.pgrid){display:none!important}
  .pgrid{display:grid!important;grid-template-columns:repeat(5,1fr);gap:4mm;padding:8mm;width:210mm}
  .pi{border:1.5px dashed #2E6DAD;padding:5px;border-radius:4px;text-align:center;page-break-inside:avoid;display:flex;flex-direction:column;align-items:center;gap:2px}
  .pi.res{border-color:#E2E8F0}
  .pi img{width:100%;aspect-ratio:1}
  .pid{font-weight:800;font-size:7px;color:#1E3A5F;letter-spacing:.3px}
  .pi.res .pid{color:#ccc}
}
</style>
</head>
<body>

<!-- ═══ PUBLIC HOME ═══ -->
<div id="pub-home">
  <div class="pub-header">
    <h1>🖥️ Deynecourt</h1>
    <p>Equipment Registry</p>
  </div>
  <div class="device-list" id="pubList"></div>
  <div class="admin-hint">
    <button onclick="showLogin()">⚙️ Admin</button>
  </div>
</div>

<!-- ═══ PUBLIC CARD ═══ -->
<div id="pub-card" class="hidden">
  <button class="back-btn" onclick="showPubHome()">← All devices</button>
  <div id="cardWrap"></div>
</div>

<!-- ═══ LOGIN ═══ -->
<div id="login-screen" class="hidden">
  <div class="login-box">
    <h2>🔐 Admin Access</h2>
    <p>Deynecourt Equipment Registry</p>
    <input type="password" id="pwInput" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Enter</button>
    <div class="login-err" id="loginErr">Wrong password</div>
    <button class="back-to-pub" onclick="showPubHome()">← Back to registry</button>
  </div>
</div>

<!-- ═══ ADMIN ═══ -->
<div id="admin-screen">
  <div class="admin-header">
    <div>
      <h1>⚙️ Deynecourt — Admin</h1>
    </div>
    <div class="hstats">
      <div class="pill" id="hT">Total: 0</div>
      <div class="pill" id="hA">Assigned: 0</div>
      <div class="pill" id="hO">In Office: 0</div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="sw"><input type="text" id="srch" placeholder="Search..."></div>
    <select id="fSt"><option value="">All Statuses</option><option>Assigned</option><option>In Office</option><option>In Storage</option><option>Repair</option><option>Retired</option></select>
    <select id="fCat"><option value="">All Categories</option><option>Laptop</option><option>Desktop</option><option>Monitor</option><option>Phone</option><option>Tablet</option><option>Mouse</option><option>Keyboard</option><option>Headphones</option><option>Printer</option><option>Webcam</option><option>Other</option></select>
    <select id="fEmp"><option value="">All Employees</option></select>
    <select id="fLoc"><option value="">All Locations</option></select>
    <div class="vt"><button class="vb active" id="bG">⊞</button><button class="vb" id="bL">≡</button></div>
    <button class="btn bo" id="btnPrint">🖨️ Print QR</button>
    <button class="btn bs" id="btnExport">💾 Save & Download</button>
    <button class="btn bs" id="btnAdd">+ Add Device</button>
  </div>
  <div class="amain">
    <div class="sumbar" id="sumbar"></div>
    <div class="gv" id="gv"></div>
    <div class="lv" id="lv"></div>
  </div>
</div>

<!-- ═══ MODAL ═══ -->
<div class="overlay" id="ov"><div class="modal"><div class="mhdr"><div><div id="msub" style="font-size:12px;opacity:.75"></div><h2 id="mtit"></h2></div><button class="mclose" id="mclose">✕</button></div><div class="mbody" id="mb"></div></div></div>

<!-- ═══ PRINT ═══ -->
<div class="pgrid" id="pg"></div>

<script>
(function(){
var PASS = "dncrt4inventory";
var BASE_URL = "https://yanadncrt.github.io/inventory/";
var devices = JSON.parse(document.getElementById('d-devices').textContent);
var QRS = JSON.parse(document.getElementById('d-qrs').textContent);
var IMGS = {};

var SC={'Assigned':'#2980B9','In Office':'#27AE60','In Storage':'#8E44AD','Repair':'#E74C3C','Retired':'#95A5A6'};
var ICONS={'Laptop':'💻','Desktop':'🖥️','Monitor':'🖥️','Mouse':'🖱️','Keyboard':'⌨️','Phone':'📱','Tablet':'📱','Printer':'🖨️','Headphones':'🎧','Webcam':'📷','Other':'📦'};
function sc(s){return SC[s]||'#95A5A6';}
function ic(c){return ICONS[c]||'📦';}
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function badge(s){var el=document.createElement('span');el.className='sbadge';el.style.background=sc(s);el.textContent=s;return el.outerHTML;}
function imgSrc(id){return IMGS[id]||'';}
function qrSrc(id){return QRS[id]?'data:image/png;base64,'+QRS[id]:'';}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2500);}

// ── SCREENS ──
function show(id){['pub-home','pub-card','login-screen','admin-screen'].forEach(function(s){document.getElementById(s).classList.toggle('hidden',s!==id);});}
function showPubHome(){show('pub-home');location.hash='';}
function showLogin(){show('login-screen');setTimeout(function(){document.getElementById('pwInput').focus();},100);}
function logout(){show('pub-home');}

function doLogin(){
  var pw=document.getElementById('pwInput').value;
  var err=document.getElementById('loginErr');
  if(pw===PASS){
    err.style.display='none';
    document.getElementById('pwInput').value='';
    show('admin-screen');
    render();
  } else {
    err.style.display='block';
    document.getElementById('pwInput').value='';
  }
}

// ── PUBLIC CARD ──
function showPubCard(id){
  var d=devices.find(function(x){return x.id===id;});
  var wrap=document.getElementById('cardWrap');
  if(!d){wrap.innerHTML='<div style="text-align:center;padding:40px;color:#95A5A6"><div style="font-size:48px">🔍</div><h2 style="margin-top:12px">Not found</h2></div>';show('pub-card');return;}
  var img=imgSrc(id);
  var qr=qrSrc(id);
  var imgHtml=img?'<img src="'+img+'" alt="">':'<div class="icon">'+ic(d.category)+'</div>';
  var fields=[
    d.employee?['👤 Employee',h(d.employee),false]:null,
    d.location?['📍 Location',h(d.location),false]:null,
    d.dept?['🏢 Department',h(d.dept),false]:null,
    d.issued?['📅 Issued',h(d.issued),false]:null,
    ['🔢 Serial','<span class="mono">'+h(d.serial)+'</span>',true],
    d.inv_number?['# Inventory',h(d.inv_number),false]:null,
    d.condition?['✅ Condition',h(d.condition),false]:null,
  ].filter(Boolean);
  var infoHtml=fields.map(function(r){return '<div class="info-item'+(r[2]?' full':'')+'"><div class="info-label">'+r[0]+'</div><div class="info-value">'+r[1]+'</div></div>';}).join('');
  wrap.innerHTML='<div class="card">'
    +'<div class="card-top"><div class="card-top-left"><div class="card-dev-id">'+h(d.id)+(d.inv_number?' · '+h(d.inv_number):'')+'</div><div class="card-model">'+(d.brand?h(d.brand)+' ':'')+h(d.model)+'</div><div class="card-cat">'+h(d.category)+'</div></div>'
    +'<div class="card-status" style="background:'+sc(d.status)+'">'+h(d.status)+'</div></div>'
    +'<div class="card-img">'+imgHtml+'</div>'
    +'<div class="card-body"><div class="info-grid">'+infoHtml+'</div></div>'
    +'<div class="card-footer"><div class="footer-brand">Deynecourt<br>Equipment Registry</div>'+(qr?'<div class="footer-qr"><img src="'+qr+'"></div>':'')+'</div>'
    +'</div>';
  show('pub-card');
  location.hash=id;
}

function buildPubList(){
  var el=document.getElementById('pubList');el.innerHTML='';
  devices.forEach(function(d){
    var img=imgSrc(d.id);
    var div=document.createElement('div');div.className='drow';
    div.innerHTML=(img?'<img class="drow-img" src="'+img+'">'
      :'<div class="drow-icon">'+ic(d.category)+'</div>')
      +'<div class="drow-info"><div class="drow-id">'+h(d.id)+'</div>'
      +'<div class="drow-model">'+(d.brand?h(d.brand)+' ':'')+h(d.model)+'</div>'
      +'<div class="drow-sub">'+(d.employee?'👤 '+h(d.employee):'No user assigned')+'</div></div>'
      +'<div class="drow-badge" style="background:'+sc(d.status)+'">'+h(d.status)+'</div>';
    div.onclick=function(){showPubCard(d.id);};
    el.appendChild(div);
  });
}

// ── ADMIN ──
function fil(){
  var q=document.getElementById('srch').value.toLowerCase();
  var fs=document.getElementById('fSt').value;
  var fc=document.getElementById('fCat').value;
  var fe=document.getElementById('fEmp').value;
  var fl=document.getElementById('fLoc').value;
  return devices.filter(function(d){
    var m=!q||[d.id,d.model,d.brand,d.serial,d.employee,d.location,d.notes].some(function(v){return v&&String(v).toLowerCase().indexOf(q)>=0;});
    return m&&(!fs||d.status===fs)&&(!fc||d.category===fc)&&(!fe||d.employee===fe)&&(!fl||d.location===fl);
  });
}

function renderSum(){
  var st=['Assigned','In Office','In Storage','Repair','Retired'];
  var cl=['#2980B9','#27AE60','#8E44AD','#E74C3C','#95A5A6'];
  var html='';st.forEach(function(s,i){var n=devices.filter(function(d){return d.status===s;}).length;if(n)html+='<div class="sp"><div class="sd" style="background:'+cl[i]+'"></div>'+h(s)+': <strong>'+n+'</strong></div>';});
  document.getElementById('sumbar').innerHTML=html;
  document.getElementById('hT').textContent='Total: '+devices.length;
  document.getElementById('hA').textContent='Assigned: '+devices.filter(function(d){return d.status==='Assigned';}).length;
  document.getElementById('hO').textContent='In Office: '+devices.filter(function(d){return d.status==='In Office';}).length;
}

function makeAdminCard(d){
  var div=document.createElement('div');div.className='acard';div.dataset.id=d.id;
  var img=imgSrc(d.id);var qr=qrSrc(d.id);
  var rows='';
  if(d.employee)rows+='<div class="irow"><span class="ilbl">👤</span>'+h(d.employee)+'</div>';
  if(d.location)rows+='<div class="irow"><span class="ilbl">📍</span>'+h(d.location)+'</div>';
  rows+='<div class="irow"><span class="ilbl">🔢</span><span class="stag">'+h(d.serial)+'</span></div>';
  div.innerHTML='<div class="acimg">'+(img?'<img src="'+img+'" alt="">':'<div style="font-size:56px">'+ic(d.category)+'</div>')+'<div class="asrib" style="background:'+sc(d.status)+'">'+h(d.status)+'</div></div>'
    +'<div class="acbody"><div class="acid">'+h(d.id)+(d.inv_number?' · '+h(d.inv_number):'')+'</div><div class="acmodel">'+(d.brand?h(d.brand)+' ':'')+h(d.model)+'</div><div class="accat">'+h(d.category)+'</div>'+rows+'</div>'
    +'<div class="acfoot">'+(qr?'<img src="'+qr+'" alt="QR">':'<span></span>')+'<div style="font-size:11px;color:#BDC3C7">Click to edit</div></div>';
  return div;
}

function renderGrid(){
  var el=document.getElementById('gv');var list=fil();el.innerHTML='';
  if(!list.length){el.innerHTML='<div class="empty">🔍 No devices found</div>';return;}
  list.forEach(function(d){el.appendChild(makeAdminCard(d));});
}

function renderList(){
  var el=document.getElementById('lv');var list=fil();
  if(!list.length){el.innerHTML='<div class="empty">🔍 No devices found</div>';return;}
  var tb=document.createElement('table');tb.className='lt';
  tb.innerHTML='<thead><tr><th>Photo</th><th>ID</th><th>Category</th><th>Model</th><th>Serial</th><th>Status</th><th>Employee</th><th>Location</th><th>QR</th></tr></thead>';
  var tbody=document.createElement('tbody');
  list.forEach(function(d){
    var tr=document.createElement('tr');tr.dataset.id=d.id;
    var img=imgSrc(d.id);var qr=qrSrc(d.id);
    tr.innerHTML='<td>'+(img?'<img class="thumb" src="'+img+'">':'<span style="font-size:24px">'+ic(d.category)+'</span>')+'</td>'
      +'<td><strong>'+h(d.id)+'</strong></td><td>'+h(d.category)+'</td>'
      +'<td>'+(d.brand?h(d.brand)+' ':'')+h(d.model)+'</td>'
      +'<td><span class="stag">'+h(d.serial)+'</span></td>'
      +'<td>'+badge(d.status)+'</td>'
      +'<td>'+h(d.employee||'')+'</td><td>'+h(d.location||'')+'</td>'
      +'<td>'+(qr?'<img src="'+qr+'" width="36" height="36" style="border-radius:4px;border:1px solid #E0E6ED;padding:2px">':'')+'</td>';
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody);el.innerHTML='';el.appendChild(tb);
}

function buildPrint(){
  var el=document.getElementById('pg');el.innerHTML='';
  for(var i=1;i<=30;i++){
    var id='DEV-'+String(i).padStart(3,'0');
    var qr=qrSrc(id);
    var d=devices.find(function(x){return x.id===id;});
    var div=document.createElement('div');
    div.className='pi'+(d?'':' res');
    if(qr)div.innerHTML='<img src="'+qr+'">';
    var pid=document.createElement('div');pid.className='pid';pid.textContent=id;
    div.appendChild(pid);
    el.appendChild(div);
  }
}

function populateFilters(){
  var empSel=document.getElementById('fEmp');
  var locSel=document.getElementById('fLoc');
  var emps=[...new Set(devices.map(function(d){return d.employee;}).filter(Boolean))].sort();
  var locs=[...new Set(devices.map(function(d){return d.location;}).filter(Boolean))].sort();
  var curEmp=empSel.value; var curLoc=locSel.value;
  empSel.innerHTML='<option value="">All Employees</option>';
  emps.forEach(function(e){var o=document.createElement('option');o.value=e;o.textContent=e;if(e===curEmp)o.selected=true;empSel.appendChild(o);});
  locSel.innerHTML='<option value="">All Locations</option>';
  locs.forEach(function(l){var o=document.createElement('option');o.value=l;o.textContent=l;if(l===curLoc)o.selected=true;locSel.appendChild(o);});
}
function render(){populateFilters();renderGrid();renderList();renderSum();buildPrint();}
function setView(v){
  document.getElementById('gv').classList.toggle('hide',v!=='grid');
  document.getElementById('lv').classList.toggle('show',v==='list');
  document.getElementById('bG').classList.toggle('active',v==='grid');
  document.getElementById('bL').classList.toggle('active',v==='list');
}

// ── MODAL ──
function openD(id){
  var d=devices.find(function(x){return x.id===id;});if(!d)return;
  document.getElementById('msub').textContent=d.category+' · '+d.id;
  document.getElementById('mtit').textContent=(d.brand?d.brand+' ':'')+d.model;
  var mb=document.getElementById('mb');mb.innerHTML='';
  var top=document.createElement('div');top.className='mtop';
  var img=imgSrc(id);
  if(img){var di=document.createElement('img');di.className='mdi';di.src=img;top.appendChild(di);}
  else{var df=document.createElement('div');df.style.cssText='font-size:64px;text-align:center;padding:10px';df.textContent=ic(d.category);top.appendChild(df);}
  var info=document.createElement('div');info.style.flex='1';
  var qr=qrSrc(id);
  info.innerHTML=badge(d.status)+'<div style="margin-top:10px"><div class="fl">Serial</div><div class="fv" style="font-family:monospace;font-size:11px">'+h(d.serial)+'</div></div>'+(d.condition?'<div style="margin-top:8px"><div class="fl">Condition</div><div class="fv">'+h(d.condition)+'</div></div>':'');
  top.appendChild(info);
  if(qr){var qi=document.createElement('img');qi.className='mqi';qi.src=qr;top.appendChild(qi);}
  mb.appendChild(top);
  var fg=document.createElement('div');fg.className='fg';fg.id='mf';mb.appendChild(fg);
  var ma=document.createElement('div');ma.className='ma';ma.id='ma';mb.appendChild(ma);
  showView(d);
  document.getElementById('ov').classList.add('open');
}

function showView(d){
  var fg=document.getElementById('mf');fg.innerHTML='';
  [['Employee','employee'],['Department','dept'],['Issued','issued'],['Returned','returned'],['Location','location'],['Type','mobile'],['Inventory #','inv_number'],['Notes','notes']].forEach(function(f,i){
    var div=document.createElement('div');div.className='ff'+(i===7?' full':'');
    div.innerHTML='<div class="fl">'+f[0]+'</div><div class="fv">'+h(d[f[1]]||'')+'</div>';
    fg.appendChild(div);
  });
  var ma=document.getElementById('ma');ma.innerHTML='';
  var btnD=document.createElement('button');btnD.className='btn br';btnD.textContent='🗑 Delete';btnD.dataset.id=d.id;btnD.id='btnDel';ma.appendChild(btnD);
  var btnP=document.createElement('button');btnP.className='btn bo';btnP.textContent='🖨️ Print QR';btnP.dataset.id=d.id;btnP.id='btnPrtQR';ma.appendChild(btnP);
  var btnE=document.createElement('button');btnE.className='btn bp';btnE.textContent='✏️ Edit';btnE.dataset.id=d.id;btnE.id='btnEdit';ma.appendChild(btnE);
}

function editD(id){
  var d=devices.find(function(x){return x.id===id;});
  document.getElementById('mtit').textContent='Editing: '+(d.brand?d.brand+' ':'')+d.model;
  var fg=document.getElementById('mf');fg.innerHTML='';
  function mkSel(eid,opts,cur){var s=document.createElement('select');s.className='fi';s.id=eid;opts.forEach(function(o){var op=document.createElement('option');op.value=o;op.textContent=o;if(o===cur)op.selected=true;s.appendChild(op);});return s;}
  function mkInp(eid,val){var i=document.createElement('input');i.className='fi';i.id=eid;i.value=val||'';return i;}
  function mkFf(lbl,el,full){var div=document.createElement('div');div.className='ff'+(full?' full':'');var l=document.createElement('div');l.className='fl';l.textContent=lbl;div.appendChild(l);div.appendChild(el);return div;}
  var sts=['Assigned','In Office','In Storage','Repair','Retired'];
  var cats=['Laptop','Desktop','Monitor','Phone','Tablet','Mouse','Keyboard','Headphones','Printer','Webcam','Projector','Other'];
  var conds=['New','Excellent','Good','Needs Attention','Retired'];
  fg.appendChild(mkFf('Status',mkSel('e_status',sts,d.status)));
  fg.appendChild(mkFf('Category',mkSel('e_category',cats,d.category)));
  fg.appendChild(mkFf('Brand',mkInp('e_brand',d.brand)));
  fg.appendChild(mkFf('Model',mkInp('e_model',d.model)));
  fg.appendChild(mkFf('Serial',mkInp('e_serial',d.serial)));
  fg.appendChild(mkFf('Inventory #',mkInp('e_inv_number',d.inv_number)));
  fg.appendChild(mkFf('Employee',mkInp('e_employee',d.employee)));
  fg.appendChild(mkFf('Department',mkInp('e_dept',d.dept)));
  fg.appendChild(mkFf('Issued',mkInp('e_issued',d.issued)));
  fg.appendChild(mkFf('Returned',mkInp('e_returned',d.returned)));
  fg.appendChild(mkFf('Location',mkInp('e_location',d.location)));
  fg.appendChild(mkFf('Type',mkSel('e_mobile',['Mobile','Stationary'],d.mobile)));
  fg.appendChild(mkFf('Condition',mkSel('e_condition',conds,d.condition)));
  fg.appendChild(mkFf('Notes',mkInp('e_notes',d.notes),true));
  var ma=document.getElementById('ma');ma.innerHTML='';
  var bc=document.createElement('button');bc.className='btn bg';bc.textContent='Cancel';bc.dataset.id=id;bc.id='btnCancelEdit';ma.appendChild(bc);
  var bs=document.createElement('button');bs.className='btn bs';bs.textContent='💾 Save';bs.dataset.id=id;bs.id='btnSave';ma.appendChild(bs);
}

function saveD(id){
  var idx=devices.findIndex(function(x){return x.id===id;});
  ['status','category','brand','model','serial','inv_number','employee','dept','issued','returned','location','mobile','condition','notes'].forEach(function(f){var el=document.getElementById('e_'+f);if(el)devices[idx][f]=el.value;});
  toast('Saved!');openD(id);render();buildPubList();
}

function delD(id){
  if(!confirm('Delete '+id+'?'))return;
  devices=devices.filter(function(x){return x.id!==id;});
  closeM();render();buildPubList();toast('Deleted');
}

function openAdd(){
  var newId='DEV-'+String(devices.length+1).padStart(3,'0');
  document.getElementById('msub').textContent='New Device';
  document.getElementById('mtit').textContent='Add Device';
  var mb=document.getElementById('mb');mb.innerHTML='';
  var cats=['Laptop','Desktop','Monitor','Phone','Tablet','Mouse','Keyboard','Headphones','Printer','Webcam','Projector','Other'];
  var sts=['Assigned','In Office','In Storage','Repair','Retired'];
  var fg=document.createElement('div');fg.className='fg';fg.id='mf';
  var ma=document.createElement('div');ma.className='ma';ma.id='ma';
  function mkSel(eid,opts){var s=document.createElement('select');s.className='fi';s.id=eid;opts.forEach(function(o){var op=document.createElement('option');op.textContent=o;s.appendChild(op);});return s;}
  function mkInp(eid,ph,val){var i=document.createElement('input');i.className='fi';i.id=eid;i.placeholder=ph||'';i.value=val||'';return i;}
  function mkFf(lbl,el,full){var div=document.createElement('div');div.className='ff'+(full?' full':'');var l=document.createElement('div');l.className='fl';l.textContent=lbl;div.appendChild(l);div.appendChild(el);return div;}
  fg.appendChild(mkFf('Device ID',mkInp('n_id','',newId)));
  fg.appendChild(mkFf('Category',mkSel('n_category',cats)));
  fg.appendChild(mkFf('Brand',mkInp('n_brand','Apple, Dell...')));
  fg.appendChild(mkFf('Model *',mkInp('n_model','e.g. MacBook Air'),true));
  fg.appendChild(mkFf('Serial *',mkInp('n_serial','Serial number')));
  fg.appendChild(mkFf('Inventory #',mkInp('n_inv_number','INV-...')));
  fg.appendChild(mkFf('Status',mkSel('n_status',sts)));
  fg.appendChild(mkFf('Type',mkSel('n_mobile',['Mobile','Stationary'])));
  fg.appendChild(mkFf('Employee',mkInp('n_employee','Full name')));
  fg.appendChild(mkFf('Department',mkInp('n_dept','Department')));
  fg.appendChild(mkFf('Issued',mkInp('n_issued','dd.mm.yyyy')));
  fg.appendChild(mkFf('Location',mkInp('n_location','Office / Storage')));
  fg.appendChild(mkFf('Condition',mkSel('n_condition',['New','Excellent','Good','Needs Attention'])));
  fg.appendChild(mkFf('Notes',mkInp('n_notes','Notes...'),true));
  mb.appendChild(fg);mb.appendChild(ma);
  var bc=document.createElement('button');bc.className='btn bg';bc.textContent='Cancel';bc.id='btnCancelAdd';ma.appendChild(bc);
  var ba=document.createElement('button');ba.className='btn bs';ba.textContent='+ Add Device';ba.id='btnSaveNew';ma.appendChild(ba);
  document.getElementById('ov').classList.add('open');
}

function saveNew(){
  var model=document.getElementById('n_model').value.trim();
  var serial=document.getElementById('n_serial').value.trim();
  if(!model){alert('Model required');return;}
  if(!serial){alert('Serial required');return;}
  devices.push({id:document.getElementById('n_id').value,category:document.getElementById('n_category').value,brand:document.getElementById('n_brand').value,model:model,serial:serial,inv_number:document.getElementById('n_inv_number').value,status:document.getElementById('n_status').value,mobile:document.getElementById('n_mobile').value,employee:document.getElementById('n_employee').value,dept:document.getElementById('n_dept').value,issued:document.getElementById('n_issued').value,returned:'',location:document.getElementById('n_location').value,condition:document.getElementById('n_condition').value,notes:document.getElementById('n_notes').value});
  closeM();render();buildPubList();toast('Device added!');
}

function prtQR(id){
  var d=devices.find(function(x){return x.id===id;});
  var qr=qrSrc(id);
  var w=window.open('','_blank');
  w.document.write('<!DOCTYPE html><html><body style="text-align:center;font-family:Arial;padding:30px">');
  if(qr)w.document.write('<img src="'+qr+'" style="width:180px;height:180px;border:2px solid #ccc;padding:6px;border-radius:8px">');
  w.document.write('<p style="font-weight:700;font-size:16px;margin:10px 0">'+h(id)+'</p>');
  if(d)w.document.write('<p style="color:#444;font-size:13px">'+(d.brand?h(d.brand)+' ':'')+h(d.model)+'</p><p style="color:#888;font-size:11px;font-family:monospace">'+h(d.serial)+'</p>');
  w.document.write('</body></html>');
  w.document.close();
  setTimeout(function(){w.print();setTimeout(function(){w.close();},600);},300);
}

function closeM(){document.getElementById('ov').classList.remove('open');}

// Event delegation
document.addEventListener('click',function(e){
  var t=e.target;
  var acard=t.closest('.acard');
  var tr=t.closest('tr[data-id]');
  if(acard&&!t.closest('.overlay'))openD(acard.dataset.id);
  else if(tr&&!t.closest('.overlay'))openD(tr.dataset.id);
  if(t.id==='mclose'||t===document.getElementById('ov'))closeM();
  if(t.id==='bG')setView('grid');
  if(t.id==='bL')setView('list');
  if(t.id==='btnPrint')window.print();
  if(t.id==='btnExport')exportFile();
  if(t.id==='btnAdd')openAdd();
  if(t.id==='btnDel')delD(t.dataset.id);
  if(t.id==='btnPrtQR')prtQR(t.dataset.id);
  if(t.id==='btnEdit')editD(t.dataset.id);
  if(t.id==='btnSave')saveD(t.dataset.id);
  if(t.id==='btnCancelEdit')openD(t.dataset.id);
  if(t.id==='btnCancelAdd')closeM();
  if(t.id==='btnSaveNew')saveNew();
});
document.getElementById('srch').addEventListener('input',render);
document.getElementById('fSt').addEventListener('change',render);
document.getElementById('fCat').addEventListener('change',render);
document.getElementById('fEmp').addEventListener('change',render);
document.getElementById('fLoc').addEventListener('change',render);

// Init
buildPubList();
var hash=location.hash.replace('#','');
if(hash==='admin')showLogin();
else if(hash)showPubCard(hash);
window.addEventListener('hashchange',function(){
  var id=location.hash.replace('#','');
  if(id==='admin')showLogin();
  else if(id)showPubCard(id);
  else showPubHome();
});

function exportFile(){
  var blob = new Blob([document.documentElement.outerHTML], {type:'text/html'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  a.click();
  toast('File downloaded! Upload to GitHub to update the site.');
}
})();
</script>
